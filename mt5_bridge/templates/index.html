<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Trading Console</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Condensed Control Bar -->
        <header class="toolbar">
            <div class="toolbar-left">
                <span class="app-title">Visual Trading Console for MetaTrader</span>
                <button id="theme-toggle" class="btn-toolbar">Toggle Dark Mode</button>
                <button id="btn-settings" class="btn-toolbar">Settings</button>
            </div>
            
            <div class="toolbar-right">
                <div class="status-indicator">
                    <span id="mt5-status-icon" class="status-icon offline"></span>
                    <span id="mt5-status-text">MT5 Offline</span>
                </div>
                
                <div class="webhook-group">
                    <label for="webhook-url">Webhook:</label>
                    <input type="text" id="webhook-url" value="Starting Ngrok..." readonly>
                    <button id="copy-btn" class="btn-toolbar">Copy</button>
                </div>
            </div>
        </header>

        <!-- Main Workspace -->
        <div class="workspace">
            
            <!-- Dense Data Grid (Tracker) -->
            <section class="grid-section">
                <div class="section-toolbar" style="display: flex; justify-content: space-between; align-items: center; padding-right: 4px;">
                    <div style="display: flex;">
                        <span class="tab active" data-tab="active">Market Orders</span>
                        <span class="tab" data-tab="history">History</span>
                        <span class="tab" data-tab="log">Trading Log</span>
                    </div>
                    <div class="filter-group" id="tracker-filters" style="display: flex; gap: 2px; align-items: center;">
                        <span style="font-size: 10px; color: var(--text-muted); margin-right: 4px;">Filter:</span>
                        <button class="btn-filter active" data-filter="all">All</button>
                        <button class="btn-filter" data-filter="active">Active</button>
                        <button class="btn-filter" data-filter="pending">Pending</button>
                    </div>
                </div>
                
                <div class="table-container">
                    <table id="tracker-table" class="data-grid">
                        <thead>
                            <tr>
                                <th style="width: 20%;">Symbol / Group</th>
                                <th style="width: 15%;">Instance</th>
                                <th style="width: 15%;">Ticket</th>
                                <th style="width: 15%;">Trade Type</th>
                                <th style="width: 35%;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tracker-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
                {% include 'trading_log.html' %}
            </section>

            <!-- Logs Section -->
            <section class="logs-section">
                <div class="section-toolbar">
                    <span class="tab active">Event Log</span>
                </div>
                <div class="log-container" id="log-box">
                    <!-- Logs populated by JS -->
                </div>
            </section>

        </div>
    </div>

    <!-- Trade Confirmation Modal (Enterprise Style) -->
    <div id="trade-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">Trade Confirmation Request</span>
            </div>
            <div class="modal-body">
                <div class="action-banner" id="modal-action-symbol">BUY EURUSD</div>
                
                <table class="details-table" id="modal-info-grid">
                    <!-- Info rows injected here -->
                </table>
                
                <div class="split-info" id="modal-split-info">
                    <!-- Split message injected here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-execute" class="btn btn-action execute">Execute</button>
                <button id="btn-abort" class="btn btn-action abort">Abort</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal" style="width: 500px;">
            <div class="modal-header">
                <span class="modal-title">Configure MT5 Instances</span>
                <button id="btn-close-settings" class="btn-toolbar" style="background: none; border: none; color: var(--text-main); cursor: pointer; font-size: 16px;">X</button>
            </div>
            <div class="modal-body">
                <div class="instance-list" id="instance-list">
                    <!-- Instances injected here -->
                </div>
                
                <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <h4 style="margin: 0 0 10px 0;">Add New Instance</h4>
                    <div style="display: flex; gap: 8px; flex-direction: column;">
                        <input type="text" id="new-instance-name" placeholder="Instance Name (e.g. Broker A)" style="padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="new-instance-path" placeholder="Path to terminal64.exe" style="flex: 1; padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary);">
                            <button id="btn-browse-path" class="btn-toolbar" style="padding: 6px 12px; background: var(--bg-secondary);">Browse...</button>
                        </div>
                        <input type="number" id="new-instance-risk" placeholder="Risk Amount ($)" value="100" style="padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <input type="text" id="new-instance-mapping" placeholder="Symbol Mapping (e.g. XAUUSD:GOLD,EURUSD:EURUSD.m)" style="padding: 6px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-primary);">
                        <button id="btn-add-instance" class="btn btn-action execute" style="margin-top: 5px;">Add Instance</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
